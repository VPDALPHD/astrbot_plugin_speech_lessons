name: astrbot_plugin_speech_lessons
display_name: 教我说话
short_desc: 私聊教一次，它就学会那个口气（说话卡 + 看图学）
desc: |
  让 AI 在私聊里被你"教说话"：发一句"这样不对，AI 味太重"、
  或者丢一张聊天截图/优秀范例说"学学"，它就把这次的口气学下来。

  - **只认主人**：只有 owner_ids 里的 QQ 能在私聊里教，群里教一律不学。
  - **她自己去学**：注册了 `learn_speech_style` 工具，模型判断"主人在教我说话"就自己调；
    同时私聊钩子兜底（钩子挂在 250000 优先级，比陪伴插件更早看到消息，不会被它的
    `stop_event()` 挡掉；同一句只学一次，不重复烧 token）。
  - **分片教学会合并**：先发截图再补一句"这样不对"时，防抖窗口内合并成一次提炼，
    不会学成"只有图"或"只有字"的半条卡。
  - **学的是说话卡**：场景 / 反例原文 / 正例原文 / 一句要点，由模型从原话提炼，
    不再用正则从人话里切碎句子。
  - **注入是对照示例**：每轮把 1~3 张卡渲染成"别这么说 → 该这么说"塞进 system_prompt，
    比罗列祈使句更能改语气。
  - **能看图**：图片范例走多模态模型（聊天截图、范例截图都认），需要模型支持图片输入。
  - **真复习**：只有你明确说"对/就是这样"才推进间隔，说"还是不对"就回退降权；
    不做"注入即复习成功"的伪复习。
  - **会淡忘**：久没用又没反馈的卡权重慢慢掉，跌破阈值自动归档。

  数据存在 data/plugin_data/astrbot_plugin_speech_lessons/lessons.db（表 cards）。
  指令：/教 列表、/教 学 <原话>、/教 删 3、/教 清、/教 关、/教 开、/教 测试 <话>

  ## 兼容性测试
  已实测可与下列插件**同时启用**（AstrBot 面板显示名 · 版本，测试环境 AstrBot 4.22 + aiocqhttp/NapCat）：
  - 我会永远陪着你 6.5.6 —— 它的私聊处理器会 stop_event 接管整轮，本插件把捕获钩子挂在
    250000 优先级排到它之前（它自己是 220000/0），所以不会漏学。
  - 我会牢牢记住你 1.10.5 —— 双方都往 system_prompt 追加（append），互不覆盖。
  - 思维链式消息防抖 1.4.2 —— 它的合并发生在消息处理器之后，本插件自带 9 秒防抖缓冲，
    分条发的「截图 + 补充文字」会合并成一次提炼。
  - 表情包管理器 5.3.3、表情包收藏库 1.7.0、大肥鱼 · 活人感 v0.4.0、大肥鱼心情 v0.3.0
  - 我会自己刷B站 1.9.7、万能解析器 v1.6.1、群典 2.0.0、我会替你留住故事 0.2.2
  - 主动消息 (Proactive Chat) v1.3.0-beta.1、QQ 消息内容归一化 1.0.1、QQ 能力增强 1.15.2
  - astrbot_plugin_blacklist_tools v1.6（该插件无中文名，面板按包名显示）
  共 16 个插件同时启用的环境下测过；工具名、指令名与上述插件均无冲突。
version: 2.1.0
author: VPDALPHD
repo: "https://github.com/VPDALPHD/astrbot_plugin_speech_lessons"
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.22,<5"
