<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>说话卡面板</title>
    <link rel="stylesheet" href="./style.css?v=4.6.5" />
  </head>
  <body>
    <header class="top">
      <div class="title-row">
        <h1>说话卡面板</h1>
        <span class="badge">教我说话</span>
      </div>
      <p class="sub">私聊里教它一次，这里就会多一张卡；下面的改动下一轮对话立刻生效。</p>
      <div class="stats" id="stats">
        <button id="cfg-btn" class="ghost" title="插件设置">⚙ 设置</button>
      </div>
    </header>

    <section class="book-wrap" id="book-card">
      <div class="book-stage" id="book-stage">
        <div class="book" id="book" role="button" tabindex="0" aria-label="点击翻开指南书">
          <div class="book-spread">
            <div class="book-page left">
                                      <div class="book-page-head">
                                        <span class="book-page-no" id="book-page-no-left">—</span>
                                        <span class="book-page-day" id="book-page-day-left"></span>
                                      </div>
                                      <div class="book-items" id="book-items-left"><div class="book-empty"></div></div>
                                      <div class="book-page-foot" id="book-page-foot-left"></div>
                                    </div>
            <div class="book-page right">
                                      <div class="book-page-head">
                                        <span class="book-page-no" id="book-page-no-right">—</span>
                                        <span class="book-page-day" id="book-page-day-right"></span>
                                      </div>
                                      <div class="book-items" id="book-items-right"><div class="book-empty"></div></div>
                                      <div class="book-page-foot" id="book-page-foot-right"></div>
                                    </div>
          </div>
          <div class="book-cover" id="book-cover">
            <div class="cover-face front">
              <div class="book-cover-inner">
                <div class="book-kicker">人类伪装指南</div>
                <div class="book-title">我 的 手 记</div>
                <div class="book-cover-sub" id="book-cover-sub">共 0 页</div>
                <div class="book-hint">点一下，翻开</div>
              </div>
              <div class="book-ribbon" aria-hidden="true"></div>
            </div>
            <div class="cover-face back" id="cover-back"></div>
          </div>
        </div>
      </div>

      <div class="book-updated" id="book-updated"></div>
      <div class="book-toolbar">
        <button id="book-prev" class="ghost" title="上一页">‹</button>
        <span class="book-indicator" id="book-indicator">— / —</span>
        <button id="book-next" class="ghost" title="下一页">›</button>
        <span class="book-sep" aria-hidden="true"></span>
        <input id="book-search" class="book-search" type="search" placeholder="输关键词翻旧页，回车" />
        <button id="book-edit" class="ghost">编辑</button>
        <button id="book-review" class="ghost">重写今日</button>
        <label class="switch-inline" title="关闭后不再注入，但她仍可自己续写">
          <input type="checkbox" id="guide-toggle" />
          <span class="track"></span>
          <span class="switch-text">注入</span>
        </label>
      </div>
      <p class="guide-meta" id="guide-meta">每轮只读最近几页，不是整本。</p>
      <div id="book-search-hit" class="book-search-hit hidden"></div>
    </section>

    <main class="card-section" aria-labelledby="cards-title">
      <h2 class="section-rule" id="cards-title">说话卡</h2>
      <div class="toolbar">
        <input id="q" class="search" type="search" placeholder="搜索 场景 / 反例 / 正例 / 要点" />
        <div class="seg" id="seg" role="tablist">
          <button data-status="active" class="on">生效中</button>
          <button data-status="archived">已归档</button>
          <button data-status="all">全部</button>
        </div>
        <div class="card-sort">
          <select id="card-sort" aria-label="说话卡排序方式">
            <option value="time">按时间顺序</option>
            <option value="uses">按注入次数顺序</option>
          </select>
          <button id="card-sort-direction" class="ghost sort-direction" type="button"
            data-direction="desc" aria-label="当前倒序，点击切换正序" title="当前倒序，点击切换正序">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path class="sort-up" d="M5 12V3M2.5 5.5 5 3l2.5 2.5" />
              <path class="sort-down" d="M11 4v9m-2.5-2.5L11 13l2.5-2.5" />
            </svg>
          </button>
        </div>
        <button id="new-btn" class="primary">＋ 新建卡片</button>
      </div>
      <div id="list" class="list" aria-busy="true">
        <div class="empty">加载中…</div>
      </div>
      <nav class="card-pagination" aria-label="说话卡分页">
        <span id="card-range" class="card-range" aria-live="polite"></span>
        <div class="card-page-buttons">
          <button id="card-prev" class="ghost" type="button" aria-label="上一页" title="上一页" disabled>‹</button>
          <span id="card-page" class="card-page-number" aria-live="polite">—</span>
          <button id="card-next" class="ghost" type="button" aria-label="下一页" title="下一页" disabled>›</button>
        </div>
        <label class="card-page-size">
          每页
          <select id="card-page-size" aria-label="每页卡片数量">
            <option value="6">6</option>
            <option value="9" selected>9</option>
            <option value="12">12</option>
            <option value="18">18</option>
            <option value="24">24</option>
            <option value="36">36</option>
          </select>
          张
        </label>
      </nav>
    </main>

    <div id="mask" class="mask hidden">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <h2 id="dlg-title">新建说话卡</h2>
          <button id="dlg-close" class="icon" title="关闭">✕</button>
        </div>
        <div class="dialog-body">
          <label class="field">
            <span>场景 <em>什么时候用（可留空 = 通用）</em></span>
            <input id="f-scene" type="text" placeholder="例：对方说“难绷”在抱怨时" />
          </label>
          <label class="field">
            <span>反例 <em>别这么说（原文）</em></span>
            <textarea id="f-bad" rows="2" placeholder="例：难绷啥呢"></textarea>
          </label>
          <label class="field">
            <span>正例 <em>该这么说（原文）</em></span>
            <textarea id="f-good" rows="2" placeholder="例：绷不住了"></textarea>
          </label>
          <label class="field">
            <span>要点 <em>一句照做就行的话</em></span>
            <textarea id="f-principle" rows="2" placeholder="例：接梗式短句，别反问，别解释"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span>标签 <em>逗号分隔</em></span>
              <input id="f-tags" type="text" placeholder="接梗,语气" />
            </label>
            <label class="field narrow">
              <span>权重 <em>越高越优先注入</em></span>
              <input id="f-weight" type="number" step="0.1" min="0" max="5" value="1.5" />
            </label>
          </div>
          <p class="hint">反例和正例至少填一个。留空的那个不会显示在注入里。</p>
        </div>
        <div class="dialog-foot">
          <span id="dlg-err" class="err"></span>
          <button id="dlg-cancel" class="ghost">取消</button>
          <button id="dlg-save" class="primary">保存</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="cfg-mask" class="mask hidden">
      <div class="dialog wide" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <h2>教我说话 · 设置</h2>
          <button id="cfg-close" class="icon" title="关闭">✕</button>
        </div>
        <div class="dialog-body" id="cfg-body">
          <p class="hint">加载中…</p>
        </div>
        <div class="dialog-foot">
          <span id="cfg-err" class="err"></span>
          <button id="cfg-cancel" class="ghost">取消</button>
          <button id="cfg-save" class="primary">保存</button>
        </div>
      </div>
    </div>

    <div id="guide-mask" class="mask hidden">
      <div class="dialog wide" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <h2 id="guide-dlg-title">编辑这一页</h2>
          <button id="guide-dlg-close" class="icon" title="关闭">✕</button>
        </div>
        <div class="dialog-body">
          <label class="field">
            <span>日期 <em>这一页记在哪天；同一天会覆盖那一页</em></span>
            <input id="guide-day" type="date" />
          </label>
          <label class="field">
            <span>条目</span>
            <textarea id="guide-text" rows="14" placeholder="1. 我发现人聊天经常不把话说完，留半句等我接，我别急着替人补完。&#10;2. 我以前一上来就想总结成三点，其实人不会这么说话，我以后先顺着说一句。&#10;3. 人被夸第一反应往往是“哪有”，然后才笑，我别急着谦虚。"></textarea>
          </label>
          <p class="hint" id="guide-count">0 字</p>
        </div>
        <div class="dialog-foot">
          <span id="guide-err" class="err"></span>
          <button id="guide-cancel" class="ghost">取消</button>
          <button id="guide-save" class="primary">保存</button>
        </div>
      </div>
    </div>

    <div id="confirm-mask" class="mask hidden">
      <div class="dialog confirm-dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <h2>确认</h2>
          <button id="confirm-close" class="icon" title="关闭">✕</button>
        </div>
        <div class="dialog-body">
          <p class="confirm-text" id="confirm-text">确定重写今日记录吗？</p>
        </div>
        <div class="dialog-foot">
          <span class="err"></span>
          <button id="confirm-cancel" class="ghost">取消</button>
          <button id="confirm-ok" class="primary">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.v5402.js?v=5404"></script>
  </body>
</html>
